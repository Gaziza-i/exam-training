services:
  - type: web
    name: ege-trainer-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.9"
      # После первого деплоя добавьте домен фронтенда, например:
      # CORS_ALLOWED_ORIGINS=https://your-site.netlify.app
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173"
